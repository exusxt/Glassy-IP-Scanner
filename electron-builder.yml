appId: com.glassy.ipscanner
productName: Glassy IP Scanner
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
  - build/icon.ico
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  executableName: GlassyIPScanner
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Glassy-IP-Scanner-Setup-${version}.${ext}
portable:
  artifactName: Glassy-IP-Scanner-${version}.${ext}
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.utilities
  hardenedRuntime: false
  gatekeeperAssess: false
linux:
  executableName: glassy-ip-scanner
  icon: build/icon.png
  desktop:
    Name: Glassy IP Scanner
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
    - target: pacman
      arch:
        - x64
        - arm64
  category: Utility
  maintainer: exusxt
  synopsis: Discover devices on your local network
npmRebuild: false
publish:
  provider: github
  owner: exusxt
  repo: Glassy-IP-Scanner
  releaseType: release
