# Builds installers for all three platforms on every tag (and on demand),
# so macOS/Linux artifacts exist even though development happens on Windows.
# Release notes come from CHANGELOG.md: the section matching the tag is used
# as the GitHub release body, and installers are published to that release.
name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
    env:
      # Skip code signing on all platforms for now; artifacts are unsigned.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm ci runs postinstall scripts on GitHub runners, but ensure the
      # Electron binary exists so packaging can never fail on a partial install.
      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer/main
        run: npm run build

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Create/update GitHub release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file=$(mktemp)
          awk -v tag="$GITHUB_REF_NAME" '
            /^## \[/ {
              if (f) exit
              if (index($0, "## [" tag "]") == 1) f = 1
            }
            f { print }
          ' CHANGELOG.md > "$notes_file"
          if [ -s "$notes_file" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file" \
              || gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes_file"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes || true
          fi
          rm -f "$notes_file"

      - name: Package and publish installers (macOS/Linux)
        if: matrix.os != 'windows-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder ${{ matrix.args }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      # Windows is built in separate passes so the artifacts come out as intended:
      # the NSIS installer is combined (x64 + arm64 in one exe; electron-updater
      # has no arch-suffixed update info on Windows, so latest.yml must point at
      # a single installer), while the portable exe is split per-arch because a
      # combined portable would double its size. Building both archs for portable
      # in one call also emits an unwanted combined file.
      #
      # Transition note: v0.1.11 also publishes the combined portable once, so
      # existing 0.1.10 portable installs (whose updater requests the un-suffixed
      # name) can auto-update. A single build with both archs emits exactly the
      # combined, x64 and arm64 portables, so that one pass covers the release.
      # Later versions drop it and keep only the per-arch portable builds.
      - name: Package and publish Windows NSIS (combined x64+arm64)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --x64 --arm64 --config.win.target=nsis --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Package and publish Windows portable (combined + x64 + arm64, v0.1.11 only)
        if: matrix.os == 'windows-latest' && startsWith(github.ref, 'refs/tags/v0.1.11')
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --x64 --arm64 --config.win.target=portable --publish always

      - name: Package and publish Windows portable (x64)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v0.1.11')
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --x64 --config.win.target=portable --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Package and publish Windows portable (arm64)
        if: matrix.os == 'windows-latest' && !startsWith(github.ref, 'refs/tags/v0.1.11')
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --arm64 --config.win.target=portable --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: glassy-ip-scanner-${{ matrix.os }}
          if-no-files-found: warn
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml
